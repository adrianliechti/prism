version: 2

# Dedicated dist dir: the frontend build (before hook) writes into the tracked
# dist/ folder at repo root (embedded via go:embed), so GoReleaser's own
# working directory must not collide with it.
dist: dist-cli

before:
  hooks:
    - sh -c 'npm ci && npm run build'
    - go mod tidy

builds:
  - id: prism
    binary: prism
    main: ./cmd/prism
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: prism
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Windows users expect zip.
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

report_sizes: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

# macOS and Linux: Homebrew cask.
homebrew_casks:
  - name: prism-cli
    # The installed command stays `prism` (the built binary name).
    binaries: [prism]
    # The publisher adds postflight_steps; GoReleaser's hooks still emit postflight.
    skip_upload: true
    repository:
      owner: adrianliechti
      name: homebrew-tap

    commit_author:
      name: Adrian Liechti
      email: adrian@localhost

    homepage: "https://github.com/adrianliechti/prism"
    description: "Insomnia/Postman-like API client, running locally in your browser"

publishers:
  - name: homebrew-cask
    # Select only the extra cask file, not the archives with ID "prism".
    ids: [prism-cli]
    extra_files:
      - glob: dist-cli/homebrew/Casks/prism-cli.rb
    env:
      - GITHUB_TOKEN={{ .Env.GITHUB_TOKEN }}
    cmd: ./scripts/publish-cask.sh {{ .Version }} prism-cli

# append: land in an existing release for the tag (or create it), so the CLI
# and desktop app release flows (.goreleaser.app.yml) don't clash.
release:
  github:
    owner: adrianliechti
    name: prism
  mode: append
